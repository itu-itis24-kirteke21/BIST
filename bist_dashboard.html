<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIST 100 Profesyonel Analiz Paneli</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #0f172a;
  min-height: 100vh;
  color: #e2e8f0;
  padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(90deg, #22c55e, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid #334155;
  background: #1e293b;
  color: #e2e8f0;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.filter-btn.active, .filter-btn:hover {
  background: #334155;
  border-color: #475569;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1e293b;
  border-radius: 12px;
  padding: 16px;
  border: 1px solid #334155;
}
.stat-card .label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-card .value {
  font-size: 24px;
  font-weight: 700;
  margin-top: 4px;
}
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.controls input, .controls select {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #1e293b;
  color: #e2e8f0;
  font-size: 14px;
  outline: none;
}
.controls input { flex: 1; min-width: 250px; }
.stock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.stock-card {
  background: #1e293b;
  border-radius: 14px;
  padding: 18px;
  border: 1px solid #334155;
  cursor: pointer;
  transition: all 0.2s;
}
.stock-card:hover {
  border-color: #475569;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.stock-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.stock-code { font-size: 18px; font-weight: 700; color: #f1f5f9; }
.stock-name { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.stock-sector { font-size: 11px; color: #64748b; margin-top: 2px; }
.stock-price { text-align: right; }
.stock-price .price { font-size: 18px; font-weight: 700; color: #f1f5f9; }
.stock-price .change { font-size: 13px; font-weight: 600; }
.score-section {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.score-ring {
  position: relative;
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.score-ring svg { transform: rotate(-90deg); }
.score-value {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  font-weight: 700;
}
.score-info { flex: 1; }
.score-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
}
.score-badges {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: #0f172a;
  color: #94a3b8;
}
.mini-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.mini-badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: #0f172a;
  color: #94a3b8;
}
.hint {
  font-size: 11px;
  color: #64748b;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: #1e293b;
  border-radius: 16px;
  max-width: 650px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid #334155;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.modal-header {
  padding: 24px;
  border-bottom: 1px solid #334155;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 { margin: 0; font-size: 22px; }
.modal-header p { margin: 4px 0 0 0; color: #94a3b8; font-size: 13px; }
.modal-close {
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 24px;
  cursor: pointer;
  padding: 4px;
}
.modal-body { padding: 24px; }
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.metric-box {
  background: #0f172a;
  border-radius: 10px;
  padding: 14px;
}
.metric-box .label { font-size: 11px; color: #94a3b8; }
.metric-box .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
.section-title {
  font-size: 14px;
  color: #94a3b8;
  margin: 0 0 12px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.indicator-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}
.indicator-box {
  background: #0f172a;
  border-radius: 8px;
  padding: 10px;
}
.indicator-box .label { font-size: 10px; color: #94a3b8; }
.indicator-box .value { font-size: 14px; font-weight: 600; }
.factor-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.factor-name { width: 180px; font-size: 12px; color: #94a3b8; }
.factor-bar {
  flex: 1;
  height: 8px;
  background: #0f172a;
  border-radius: 4px;
  overflow: hidden;
}
.factor-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s;
}
.factor-score { width: 40px; text-align: right; font-size: 12px; font-weight: 600; }
.analysis-box {
  background: #0f172a;
  border-radius: 10px;
  padding: 16px;
  border-left: 3px solid #3b82f6;
  line-height: 1.7;
  font-size: 14px;
  color: #cbd5e1;
}
.reason-item {
  background: #0f172a;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 13px;
  color: #cbd5e1;
  border-left: 3px solid #334155;
}

@media (max-width: 600px) {
  .metric-grid, .indicator-grid { grid-template-columns: 1fr; }
  .factor-name { width: 120px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📊 BIST 100 Profesyonel Analiz</h1>
      <p>Yahoo Finance Gerçek Verileri • RSI • MACD • EMA • Bollinger • F/K • ROE</p>
      <p style="color:#64748b;font-size:11px;">Son Güncelleme: <span id="last-update">-</span></p>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterStocks('all')" data-filter="all">Tümü</button>
      <button class="filter-btn" onclick="filterStocks('positive')" data-filter="positive">🟢 Olumlu</button>
      <button class="filter-btn" onclick="filterStocks('negative')" data-filter="negative">🔴 Olumsuz</button>
      <button class="filter-btn" onclick="filterStocks('neutral')" data-filter="neutral">⚪ Nötr</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Analiz Edilen Hisse</div>
      <div class="value" id="total-count">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Olumlu Hisseler</div>
      <div class="value" id="positive-count" style="color:#22c55e">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Olumsuz Hisseler</div>
      <div class="value" id="negative-count" style="color:#ef4444">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Ortalama Skor</div>
      <div class="value" id="avg-score" style="color:#f59e0b">-</div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Hisse kodu ara (örn: GARAN, ASELS)..." oninput="searchStocks()">
    <select id="sort-select" onchange="sortStocks()">
      <option value="score-desc">Skor: Yüksek → Düşük</option>
      <option value="score-asc">Skor: Düşük → Yüksek</option>
      <option value="change-desc">Değişim: Yüksek → Düşük</option>
      <option value="change-asc">Değişim: Düşük → Yüksek</option>
      <option value="name">İsim (A-Z)</option>
    </select>
  </div>

  <div class="stock-grid" id="stock-grid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-title">-</h2>
        <p id="modal-subtitle">-</p>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ============================================
// VERİ YÜKLEME - bist_analysis_results.json dosyasını buraya yükleyin
// ============================================
// Örnek veri yapısı (gerçek verileri Python scripti ile oluşturun):
let stocksData = [];

// JSON dosyasını otomatik yükle
try {
  fetch('bist_analysis_results.json')
    .then(r => r.json())
    .then(data => { stocksData = data; init(); })
    .catch(() => { 
      // Demo veri (gerçek veri yoksa)
      stocksData = [
        {"code":"GARAN","name":"Garanti BBVA","sector":"Bankacılık","price":127.80,"change":-1.46,"technicalScore":35,"fundamentalScore":49,"totalScore":84,"sentiment":"positive","rsi":52.0,"macd":-1.162,"macd_signal":-2.123,"macd_hist":0.961,"ema20":128.29,"ema50":130.47,"bb_position":0.45,"vol_ratio":1.0,"range_position":25.5,"pe":4.43,"pb":1.10,"beta":0.51,"profit_margin":31.57,"roe":28.13,"debt_equity":0.0,"rec_mean":1.5,"wk_low":115.40,"wk_high":169.70,"reasons":["✅ RSI 52.0 güçlü momentum","✅ MACD histogram pozitif","❌ Fiyat EMA 50 altında","✅ F/K 4.4 ucuz","✅ ROE %28.1 güçlü","✅ Analist: Güçlü Al"],"analysis":"Garanti BBVA güçlü temel verilere sahip. F/K 4.4 ile değerlemesi makul. ROE %28.1 ile sektörün üzerinde."},
        {"code":"ASELS","name":"Aselsan","sector":"Savunma","price":363.00,"change":4.69,"technicalScore":42,"fundamentalScore":34,"totalScore":76,"sentiment":"positive","rsi":55.0,"macd":-6.657,"macd_signal":-8.234,"macd_hist":1.577,"ema20":357.70,"ema50":367.02,"bb_position":0.62,"vol_ratio":1.2,"range_position":68.5,"pe":49.75,"pb":5.26,"beta":0.87,"profit_margin":18.15,"roe":15.0,"debt_equity":23.8,"rec_mean":2.2,"wk_low":167.00,"wk_high":450.00,"reasons":["✅ RSI 55.0 güçlü","✅ MACD histogram pozitif","✅ Hacim yüksek","⚠️ F/K 49.8 yüksek"],"analysis":"Aselsan teknik olarak güçlü sinyaller veriyor. Savunma sektöründeki büyüme beklentileri pozitif."},
        {"code":"KCHOL","name":"Koç Holding","sector":"Holding","price":195.90,"change":-4.90,"technicalScore":38,"fundamentalScore":37,"totalScore":75,"sentiment":"positive","rsi":48.8,"macd":1.343,"macd_signal":0.456,"macd_hist":0.887,"ema20":196.56,"ema50":195.51,"bb_position":0.52,"vol_ratio":2.3,"range_position":52.8,"pe":20.63,"pb":0.70,"beta":1.00,"profit_margin":1.18,"roe":6.4,"debt_equity":123.0,"rec_mean":1.2,"wk_low":146.00,"wk_high":229.10,"reasons":["⚪ RSI nötr","✅ MACD pozitif","❌ Hacim yüksek ama düşüş","⚠️ Borç/ÖK yüksek","✅ Analist: Güçlü Al"],"analysis":"Koç Holding karışık sinyaller veriyor. MACD pozitif ancak yüksek hacimli satış baskısı var."},
      ];
      init();
    });
} catch(e) {
  init();
}

let currentFilter = 'all';
let currentSort = 'score-desc';

function getScoreColor(score) {
  if (score >= 75) return '#22c55e';
  if (score >= 55) return '#84cc16';
  if (score >= 40) return '#f59e0b';
  if (score >= 25) return '#f97316';
  return '#ef4444';
}
function getSentimentLabel(s) {
  return {positive:'OLUMLU',negative:'OLUMSUZ',neutral:'NÖTR'}[s]||'NÖTR';
}
function getSentimentEmoji(s) {
  return {positive:'🟢',negative:'🔴',neutral:'⚪'}[s]||'⚪';
}

function init() {
  document.getElementById('last-update').textContent = new Date().toLocaleString('tr-TR');
  updateStats();
  applyFilters();
}

function updateStats() {
  const pos = stocksData.filter(s=>s.sentiment==='positive').length;
  const neg = stocksData.filter(s=>s.sentiment==='negative').length;
  const avg = stocksData.length ? Math.round(stocksData.reduce((a,s)=>a+s.totalScore,0)/stocksData.length) : 0;
  document.getElementById('total-count').textContent = stocksData.length;
  document.getElementById('positive-count').textContent = pos;
  document.getElementById('negative-count').textContent = neg;
  document.getElementById('avg-score').textContent = avg;
  document.getElementById('avg-score').style.color = getScoreColor(avg);
}

function renderCards(stocks) {
  const grid = document.getElementById('stock-grid');
  if (!stocks.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#64748b;font-size:16px;">🔍 Arama kriterlerine uygun hisse bulunamadı.</div>';
    return;
  }
  grid.innerHTML = stocks.map(stock => {
    const color = getScoreColor(stock.totalScore);
    const cColor = stock.change >= 0 ? '#22c55e' : '#ef4444';
    const cIcon = stock.change >= 0 ? '▲' : '▼';
    const dash = 2 * Math.PI * 24;
    const offset = dash - (stock.totalScore / 100) * dash;
    return `
      <div class="stock-card" onclick="openModal('${stock.code}')">
        <div class="stock-header">
          <div>
            <div class="stock-code">${stock.code}</div>
            <div class="stock-name">${stock.name}</div>
            <div class="stock-sector">${stock.sector}</div>
          </div>
          <div class="stock-price">
            <div class="price">${stock.price.toFixed(2)} ₺</div>
            <div class="change" style="color:${cColor}">${cIcon} %${Math.abs(stock.change).toFixed(2)}</div>
          </div>
        </div>
        <div class="score-section">
          <div class="score-ring">
            <svg width="56" height="56" viewBox="0 0 56 56">
              <circle cx="28" cy="28" r="24" fill="none" stroke="#334155" stroke-width="5"/>
              <circle cx="28" cy="28" r="24" fill="none" stroke="${color}" stroke-width="5"
                stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
            </svg>
            <div class="score-value" style="color:${color}">${stock.totalScore}</div>
          </div>
          <div class="score-info">
            <div class="score-label" style="color:${color}">
              ${getSentimentEmoji(stock.sentiment)} ${getSentimentLabel(stock.sentiment)}
            </div>
            <div class="score-badges">
              <span class="badge">Teknik: ${stock.technicalScore}</span>
              <span class="badge">Temel: ${stock.fundamentalScore}</span>
            </div>
          </div>
        </div>
        <div class="mini-badges">
          <span class="mini-badge">RSI: ${stock.rsi}</span>
          <span class="mini-badge">F/K: ${stock.pe}</span>
          <span class="mini-badge">ROE: %${stock.roe}</span>
        </div>
        <div class="hint">💡 Detaylı analiz için tıklayın</div>
      </div>
    `;
  }).join('');
}

function filterStocks(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
  applyFilters();
}
function searchStocks() { applyFilters(); }
function sortStocks() { currentSort = document.getElementById('sort-select').value; applyFilters(); }

function applyFilters() {
  const search = document.getElementById('search-input').value.toUpperCase();
  let filtered = stocksData.filter(s => {
    if (currentFilter !== 'all' && s.sentiment !== currentFilter) return false;
    if (search && !s.code.includes(search) && !s.name.toUpperCase().includes(search)) return false;
    return true;
  });
  const sorts = {
    'score-desc': (a,b) => b.totalScore - a.totalScore,
    'score-asc': (a,b) => a.totalScore - b.totalScore,
    'change-desc': (a,b) => b.change - a.change,
    'change-asc': (a,b) => a.change - b.change,
    'name': (a,b) => a.code.localeCompare(b.code),
  };
  filtered.sort(sorts[currentSort] || sorts['score-desc']);
  renderCards(filtered);
}

function openModal(code) {
  const s = stocksData.find(x => x.code === code);
  if (!s) return;
  const color = getScoreColor(s.totalScore);
  const cColor = s.change >= 0 ? '#22c55e' : '#ef4444';
  const cIcon = s.change >= 0 ? '▲' : '▼';

  document.getElementById('modal-title').textContent = s.code;
  document.getElementById('modal-subtitle').textContent = `${s.name} — ${s.sector}`;

  const techIndicators = [
    {l:'RSI (14)', v:s.rsi},
    {l:'MACD', v:s.macd},
    {l:'MACD Sinyal', v:s.macd_signal},
    {l:'MACD Histogram', v:(s.macd_hist>=0?'+':'')+s.macd_hist, c: s.macd_hist>=0?'#22c55e':'#ef4444'},
    {l:'EMA 20', v:s.ema20},
    {l:'EMA 50', v:s.ema50},
    {l:'BB Pozisyonu', v:(s.bb_position*100).toFixed(0)+'%'},
    {l:'Hacim Oranı', v:s.vol_ratio+'x'},
  ];
  const fundIndicators = [
    {l:'F/K Oranı', v:s.pe},
    {l:'PD/DD', v:s.pb},
    {l:'Beta', v:s.beta},
    {l:'Kâr Marjı', v:'%'+s.profit_margin},
    {l:'ROE', v:'%'+s.roe},
    {l:'Borç/ÖK', v:s.debt_equity},
    {l:'Analist Tavsiye', v:s.rec_mean},
    {l:'52H Pozisyon', v:'%'+s.range_position},
  ];

  const techHtml = techIndicators.map(i => `
    <div class="indicator-box">
      <div class="label">${i.l}</div>
      <div class="value" style="color:${i.c||'#f1f5f9'}">${i.v}</div>
    </div>
  `).join('');

  const fundHtml = fundIndicators.map(i => `
    <div class="indicator-box">
      <div class="label">${i.l}</div>
      <div class="value">${i.v}</div>
    </div>
  `).join('');

  const reasonsHtml = s.reasons.map(r => `<div class="reason-item">${r}</div>`).join('');

  document.getElementById('modal-body').innerHTML = `
    <div class="metric-grid">
      <div class="metric-box"><div class="label">Güncel Fiyat</div><div class="value">${s.price.toFixed(2)} ₺</div></div>
      <div class="metric-box"><div class="label">Günlük Değişim</div><div class="value" style="color:${cColor}">${cIcon} %${Math.abs(s.change).toFixed(2)}</div></div>
      <div class="metric-box"><div class="label">Teknik Skor</div><div class="value" style="color:${color}">${s.technicalScore}</div></div>
      <div class="metric-box"><div class="label">Temel Skor</div><div class="value" style="color:${color}">${s.fundamentalScore}</div></div>
    </div>
    <h3 class="section-title">📈 Teknik Göstergeler</h3>
    <div class="indicator-grid">${techHtml}</div>
    <h3 class="section-title">📊 Temel Göstergeler</h3>
    <div class="indicator-grid">${fundHtml}</div>
    <h3 class="section-title">💡 Analiz Nedenleri</h3>
    ${reasonsHtml}
    <h3 class="section-title" style="margin-top:16px">🎯 Yapay Zeka Analizi</h3>
    <div class="analysis-box" style="border-left-color:${color}">${s.analysis}</div>
  `;

  document.getElementById('detail-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('active');
}
</script>
</body>
</html>
